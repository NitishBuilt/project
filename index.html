<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sign in</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			color: #172033;
			background: linear-gradient(135deg, #eef2ff, #f8fafc 55%, #e0f2fe);
		}
		.login-card {
			width: min(100%, 420px);
			padding: 40px;
			background: #fff;
			border: 1px solid #e5e7eb;
			border-radius: 20px;
			box-shadow: 0 20px 60px rgba(30, 41, 59, .12);
		}
		.brand { margin: 0 0 28px; font-size: 14px; font-weight: 700; color: #4f46e5; letter-spacing: .08em; text-transform: uppercase; }
		h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: -.03em; }
		.intro { margin: 0 0 28px; color: #64748b; line-height: 1.5; }
		label { display: block; margin: 18px 0 8px; font-size: 14px; font-weight: 600; }
		input {
			width: 100%;
			padding: 13px 14px;
			border: 1px solid #cbd5e1;
			border-radius: 10px;
			font: inherit;
			outline: none;
		}
		input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, .15); }
		.options { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 16px 0 22px; font-size: 13px; }
		.remember { display: flex; align-items: center; gap: 8px; color: #475569; }
		.remember input { width: auto; }
		a { color: #4f46e5; text-decoration: none; font-weight: 600; }
		a:hover { text-decoration: underline; }
		button {
			width: 100%;
			padding: 14px;
			border: 0;
			border-radius: 10px;
			background: #4f46e5;
			color: white;
			font: inherit;
			font-weight: 700;
			cursor: pointer;
		}
		button:hover { background: #4338ca; }
		.signup { margin: 24px 0 0; text-align: center; color: #64748b; font-size: 14px; }
		@media (max-width: 480px) { .login-card { padding: 30px 24px; } }
	</style>
</head>
<body>
	<main class="login-card">
		<p class="brand">Welcome</p>
		<h1>Sign in</h1>
		<p class="intro">Enter your details to access your account.</p>
		<form action="#" method="post">
			<label for="email">Email address</label>
			<input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>

			<label for="password">Password</label>
			<input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>

			<div class="options">
				<label class="remember"><input type="checkbox" name="remember"> Remember me</label>
				<a href="#forgot-password">Forgot password?</a>
			</div>
			<button type="submit">Sign in</button>
		</form>
		<p class="signup">Don’t have an account? <a href="#sign-up">Create one</a></p>
	</main>
</body>
</html>
